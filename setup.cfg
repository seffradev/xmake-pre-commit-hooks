[metadata]
name = Xmake hooks
version = 1.0.0
description = pre-commit hooks for Xmake-based projects
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/seffradev/xmake-pre-commit-hooks
author = Hampus Avekvist
author_email = hampus.avekvist@hey.com
license = MIT
license_file = LICENSE

[options]
packages = find:
python_requires = >=3.6.1

[options.entry_points]
console_scripts =
    format = hooks.format:main
